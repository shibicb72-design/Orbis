name: Mutation proof

# Proof run only, never merged. Applies one patch per matrix entry (proof/mut/<n>.patch) and runs the tab-sleep tests;
# also counts the lint warnings. Same pinned actions as android.yml. No secret, no upload.
on: pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
            export ANDROID_HOME
          fi
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint and count warnings
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:lintDebug --stacktrace
          echo "gradle exit code: $?"
          set -e
          report=app/build/reports/lint-results-debug.xml
          if [ -f "$report" ]; then
            n=$(grep -o 'severity="Warning"' "$report" | wc -l)
            line="lint_warnings=$n"
            echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            line="lint_warnings=NOT MEASURED"
            echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "lint report not at $report; lint-results files found:"
            find app/build -name 'lint-results*' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi