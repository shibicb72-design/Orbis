name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs (a moved tag cannot change what runs); the comment names the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
            export ANDROID_HOME
          fi
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: YouTube ad observer tests
        run: node app/src/test/js/yt-ads.test.js

      - name: Engine currency script tests (offline)
        run: python3 -I scripts/test_check_engine_currency.py

      - name: Torrent natives script tests (offline)
        run: |
          python3 -I scripts/test_check_torrent_natives.py
          python3 -I scripts/test_compare_torrent_natives.py

      - name: Assemble debug APK, unit tests, lint, and shrink a release APK
        run: |
          chmod +x gradlew
          # assembleRelease is unsigned on CI (no upload key). It runs R8 so a keep-rule miss fails here.
          ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease --stacktrace

      # Gradle prints nothing for passing tests. This lists every class with its counts (and every test of the
      # classes named below) in the job summary, also when the build failed.
      - name: Unit test summary
        if: ${{ !cancelled() }}
        env:
          DETAIL_CLASSES: com.shibi.orbis.share.ShareIntentsTest com.shibi.orbis.share.ShareOutCacheTest
        run: python3 -I scripts/unit_test_summary.py app/build/test-results/testDebugUnitTest | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Upload debug APK (arm64-v8a)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload debug APK (x86_64, emulator)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

      # Every native library (GeckoView, libtorrent4j, ...) must load on 16 KB-page devices. All pass today, so strict.
      - name: 16 KB page alignment (arm64-v8a debug APK)
        run: python3 scripts/check_16kb_alignment.py --strict app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      # The torrent natives are ours (app/src/main/jniLibs, native/libtorrent4j/CHECKSUMS.sha256). Each debug and
      # release APK must carry libtorrent4j.so for its ABI, with at least the OpenSSL that versions.env records and
      # libtorrent 2.1.0.0, and byte for byte the file CHECKSUMS.sha256 lists for that ABI (packaging must change
      # nothing). A missing library fails the step.
      - name: Torrent natives in the APKs
        run: |
          set -euo pipefail
          min_openssl="$(sed -n 's/^OPENSSL_VERSION=//p' native/libtorrent4j/versions.env)"
          test -n "$min_openssl"
          for type in debug release; do
            for abi in arm64-v8a x86_64; do
              apks=(app/build/outputs/apk/"$type"/app-"$abi"-"$type"*.apk)
              test "${#apks[@]}" -eq 1
              test -f "${apks[0]}"
              python3 -I scripts/check_torrent_natives.py --min-openssl "$min_openssl" --libtorrent 2.1.0.0 \
                --abis "$abi" --checksums native/libtorrent4j/CHECKSUMS.sha256 "${apks[0]}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

      # A separate Gradle call: the ABI splits are off when a bundle task is requested (app/build.gradle.kts). Unsigned
      # on CI. The bundle is what Play receives, and it is the only artifact that carries the 32-bit library.
      - name: Build the release bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Torrent natives in the bundle
        run: |
          set -euo pipefail
          min_openssl="$(sed -n 's/^OPENSSL_VERSION=//p' native/libtorrent4j/versions.env)"
          test -n "$min_openssl"
          python3 -I scripts/check_torrent_natives.py --min-openssl "$min_openssl" --libtorrent 2.1.0.0 \
            --abis arm64-v8a,armeabi-v7a,x86_64 --checksums native/libtorrent4j/CHECKSUMS.sha256 \
            app/build/outputs/bundle/release/app-release.aab \
            | tee -a "$GITHUB_STEP_SUMMARY"
